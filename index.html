<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidStar - פלטפורמת הסטרימינג המקצועית</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0b0b0b; }
      ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #3b3b3b; }
    </style>
  </head>
  <body class="bg-[#0b0b0b] text-neutral-100 m-0 p-0 font-sans selection:bg-red-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // מערכת אייקונים פנימית נקייה ומותאמת אישית
      const Icons = {
        BrandLogo: () => (
          <div className="flex items-center gap-2.5 select-none cursor-pointer">
            <div className="w-9 h-9 bg-gradient-to-tr from-red-600 to-rose-500 rounded-xl flex items-center justify-center font-black text-lg text-white shadow-md shadow-red-600/20">
              V
            </div>
            <div className="flex flex-col">
              <span className="text-lg font-black tracking-tight leading-none text-white">
                Vid<span className="text-red-500">Star</span>
              </span>
              <span className="text-[9px] text-neutral-400 font-bold tracking-widest uppercase">Network</span>
            </div>
          </div>
        ),
        Menu: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
        Search: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
        Plus: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
        Home: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
        Film: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 3v18"/><path d="m15 3v18"/><path d="m3 9h18"/><path d="m3 15h18"/></svg>,
        User: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
        Shield: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,
        Trash: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
        Play: (p) => <svg viewBox="0 0 24 24" fill="currentColor" {...p}><polygon points="5 3 19 12 5 21 5 3"/></svg>
      };

      function App() {
        const [isSidebarOpen, setIsSidebarOpen] = useState(true);
        const [currentView, setCurrentView] = useState('home');
        const [selectedCategory, setSelectedCategory] = useState('הכל');
        const [categories, setCategories] = useState(['הכל', 'גיימינג', 'לייבים', 'מוזיקה', 'טכנולוגיה']);
        const [newCatInput, setNewCatInput] = useState('');
        
        // רשימת התוכן מנוהלת דינמית לגמרי
        const [videos, setVideos] = useState([]);
        const [activeVideo, setActiveVideo] = useState(null);

        // טופס העלאה
        const [isUploadOpen, setIsUploadOpen] = useState(false);
        const [formTitle, setFormTitle] = useState('');
        const [formThumb, setFormThumb] = useState('');
        const [formCategory, setFormCategory] = useState('גיימינג');
        const [formIsLive, setFormIsLive] = useState(false);
        const [formDesc, setFormDesc] = useState('');

        // צ'אט חי למודרטורים
        const [chatLogs, setChatLogs] = useState([
          { id: 1, user: 'מערכת בטיחות', text: 'הצ׳אט מאובטח תחת פיקוח מודרטורים של VidStar.', role: 'sys' }
        ]);
        const [chatInput, setChatInput] = useState('');

        const handleAddCategory = (e) => {
          e.preventDefault();
          if (newCatInput.trim() && !categories.includes(newCatInput.trim())) {
            setCategories([...categories, newCatInput.trim()]);
            setNewCatInput('');
          }
        };

        const handleUploadSubmit = (e) => {
          e.preventDefault();
          if (!formTitle.trim()) return;

          const newEntry = {
            id: Date.now().toString(),
            title: formTitle,
            channelName: 'הערוץ שלי',
            views: '1 צפייה',
            time: 'זה עתה',
            category: formCategory,
            isLive: formIsLive,
            thumbnail: formThumb.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80',
            description: formDesc || 'תוכן שנוהל והועלה דרך פלטפורמת היוצרים.'
          };

          setVideos([newEntry, ...videos]);
          setFormTitle('');
          setFormThumb('');
          setFormDesc('');
          setIsUploadOpen(false);
          setCurrentView('home');
        };

        const visibleVideos = selectedCategory === 'הכל' 
          ? videos 
          : videos.filter(v => v.category === selectedCategory || (selectedCategory === 'לייבים' && v.isLive));

        return (
          <div className="min-h-screen bg-[#0b0b0b] text-neutral-100 flex flex-col font-sans">
            
            {/* Top Navigation Bar */}
            <header className="h-14 bg-[#0b0b0b]/95 backdrop-blur border-b border-[#222222] px-4 flex items-center justify-between sticky top-0 z-50">
              <div className="flex items-center gap-4">
                <button 
                  onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                  className="p-2 hover:bg-[#1f1f1f] rounded-xl transition text-neutral-300"
                >
                  <Icons.Menu className="w-5 h-5" />
                </button>
                <div onClick={() => setCurrentView('home')}>
                  <Icons.BrandLogo />
                </div>
              </div>

              <div className="hidden md:flex items-center flex-1 max-w-xl mx-8">
                <div className="flex w-full items-center bg-[#141414] border border-[#262626] rounded-full overflow-hidden focus-within:border-red-600 transition">
                  <input 
                    type="text" 
                    placeholder="חיפוש חופשי במערכת..." 
                    className="w-full bg-transparent px-5 py-2 text-xs text-white focus:outline-none placeholder-neutral-500"
                  />
                  <button className="bg-[#1f1f1f] hover:bg-[#262626] px-5 py-2 text-neutral-300 border-r border-[#262626] transition">
                    <Icons.Search className="w-4 h-4" />
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                <button 
                  onClick={() => setIsUploadOpen(true)}
                  className="flex items-center gap-2 bg-red-600 hover:bg-red-500 px-4 py-1.5 rounded-full text-xs font-bold transition shadow-lg shadow-red-600/25"
                >
                  <Icons.Plus className="w-4 h-4" />
                  <span>העלה תוכן</span>
                </button>

                <button 
                  onClick={() => setCurrentView('my-channel')}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold transition border ${currentView === 'my-channel' ? 'bg-[#262626] border-neutral-500 text-white' : 'bg-[#141414] border-[#262626] hover:bg-[#1f1f1f] text-neutral-300'}`}
                >
                  <Icons.User className="w-4 h-4" />
                  <span>הערוץ שלי</span>
                </button>
              </div>
            </header>

            <div className="flex flex-1">
              
              {/* Sidebar Menu */}
              {isSidebarOpen && (
                <aside className="w-60 p-3 hidden md:flex flex-col gap-1 border-l border-[#222222] sticky top-14 h-[calc(100vh-56px)] overflow-y-auto">
                  <button 
                    onClick={() => { setCurrentView('home'); setSelectedCategory('הכל'); }}
                    className={`flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${currentView === 'home' ? 'bg-[#1f1f1f] text-white font-bold' : 'text-neutral-400 hover:bg-[#141414] hover:text-white'}`}
                  >
                    <Icons.Home className="w-4 h-4 text-red-500" />
                    <span>דף הבית</span>
                  </button>

                  <button 
                    onClick={() => setCurrentView('my-channel')}
                    className={`flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${currentView === 'my-channel' ? 'bg-[#1f1f1f] text-white font-bold' : 'text-neutral-400 hover:bg-[#141414] hover:text-white'}`}
                  >
                    <Icons.Film className="w-4 h-4 text-blue-500" />
                    <span>הסרטונים והלייבים שלי</span>
                  </button>

                  <hr className="border-[#222222] my-3" />
                  
                  <div className="px-3 text-[11px] font-bold text-neutral-500 mb-1">ניהול קטגוריות</div>
                  <form onSubmit={handleAddCategory} className="px-1 mb-2 flex gap-1">
                    <input 
                      type="text" 
                      placeholder="הוסף קטגוריה..." 
                      value={newCatInput}
                      onChange={(e) => setNewCatInput(e.target.value)}
                      className="flex-1 bg-[#141414] border border-[#262626] rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-red-600"
                    />
                    <button type="submit" className="bg-red-600 hover:bg-red-500 px-2.5 py-1 rounded-lg text-xs font-bold">+</button>
                  </form>

                  <div className="flex flex-col gap-0.5">
                    {categories.map(cat => (
                      <button 
                        key={cat}
                        onClick={() => { setSelectedCategory(cat); setCurrentView('home'); }}
                        className={`text-right px-3 py-1.5 rounded-lg text-xs transition ${selectedCategory === cat && currentView === 'home' ? 'bg-[#262626] text-white font-bold' : 'text-neutral-400 hover:bg-[#141414] hover:text-white'}`}
                      >
                        # {cat}
                      </button>
                    ))}
                  </div>
                </aside>
              )}

              {/* Main Content Area */}
              <main className="flex-1 p-6">
                
                {/* HOME VIEW */}
                {currentView === 'home' && (
                  <div>
                    <div className="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
                      {categories.map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition border ${selectedCategory === cat ? 'bg-white text-black border-white' : 'bg-[#181818] text-neutral-300 border-[#262626] hover:bg-[#222222]'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    {visibleVideos.length === 0 ? (
                      <div className="text-center py-24 bg-[#111111] rounded-3xl border border-[#222222] max-w-lg mx-auto my-6">
                        <div className="w-14 h-14 bg-red-600/10 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-3">
                          <Icons.Film className="w-7 h-7" />
                        </div>
                        <h2 className="text-base font-bold mb-1">המרחב הזה ריק כרגע</h2>
                        <p className="text-xs text-neutral-400 mb-5">העלה את הסרטון או השידור החי הראשון שלך לפלטפורמה.</p>
                        <button 
                          onClick={() => setIsUploadOpen(true)}
                          className="bg-red-600 hover:bg-red-500 px-5 py-2 rounded-full text-xs font-bold transition shadow-lg shadow-red-600/30"
                        >
                          העלה תוכן חדש
                        </button>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {visibleVideos.map(vid => (
                          <div 
                            key={vid.id}
                            onClick={() => { setActiveVideo(vid); setCurrentView('watch'); }}
                            className="group cursor-pointer flex flex-col gap-2.5"
                          >
                            <div className="relative aspect-video bg-[#141414] rounded-2xl overflow-hidden border border-[#222222]">
                              <img src={vid.thumbnail} alt={vid.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                              {vid.isLive && (
                                <span className="absolute top-2.5 right-2.5 bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded-md flex items-center gap-1 shadow">
                                  <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> LIVE
                                </span>
                              )}
                            </div>
                            <div className="flex gap-3 px-0.5">
                              <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-red-600 to-rose-500 flex items-center justify-center font-bold text-xs shrink-0">
                                V
                              </div>
                              <div>
                                <h3 className="font-bold text-sm line-clamp-2 text-white group-hover:text-red-400 transition leading-snug">{vid.title}</h3>
                                <p className="text-xs text-neutral-400 mt-1">{vid.channelName}</p>
                                <p className="text-[11px] text-neutral-500">{vid.views} • {vid.time}</p>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* MY CHANNEL VIEW */}
                {currentView === 'my-channel' && (
                  <div className="space-y-6 max-w-5xl mx-auto">
                    <div className="bg-[#111111] p-6 rounded-3xl border border-[#222222] flex items-center gap-5 shadow-xl">
                      <div className="w-16 h-16 bg-gradient-to-tr from-red-600 to-rose-500 rounded-2xl flex items-center justify-center text-2xl font-black shadow-lg shadow-red-600/30">
                        V
                      </div>
                      <div>
                        <h1 className="text-xl font-black">הערוץ שלי (Creator Studio)</h1>
                        <p className="text-xs text-neutral-400 mt-0.5">מרחב הניהול הפרטי של התכנים והשידורים החיים שלך.</p>
                      </div>
                    </div>

                    <h2 className="text-sm font-bold text-neutral-300">התוכן שלך ({videos.filter(v => v.channelName === 'הערוץ שלי').length})</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                      {videos.filter(v => v.channelName === 'הערוץ שלי').map(vid => (
                        <div key={vid.id} className="bg-[#111111] p-3.5 rounded-2xl border border-[#222222] flex flex-col gap-2.5 shadow-md">
                          <img src={vid.thumbnail} alt={vid.title} className="aspect-video object-cover rounded-xl border border-[#222222]" />
                          <h3 className="font-bold text-xs line-clamp-1">{vid.title}</h3>
                          <div className="flex justify-between items-center mt-1 pt-2.5 border-t border-[#222222]">
                            <span className="text-[11px] text-neutral-400 font-medium">{vid.isLive ? '🔴 שידור חי' : '🎬 סרטון'}</span>
                            <button 
                              onClick={() => setVideos(videos.filter(item => item.id !== vid.id))}
                              className="text-red-500 hover:bg-red-500/10 px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1"
                            >
                              <Icons.Trash className="w-3.5 h-3.5" /> מחק
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* WATCH & MODERATOR CHAT VIEW */}
                {currentView === 'watch' && activeVideo && (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
                    <div className="lg:col-span-2 space-y-4">
                      <div className="aspect-video bg-black rounded-3xl overflow-hidden relative shadow-2xl border border-[#222222]">
                        <img src={activeVideo.thumbnail} alt={activeVideo.title} className="w-full h-full object-cover opacity-80" />
                        <div className="absolute inset-0 flex items-center justify-center">
                          <div className="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center cursor-pointer hover:scale-110 transition shadow-lg shadow-red-600/40">
                            <Icons.Play className="w-7 h-7 fill-current ml-0.5" />
                          </div>
                        </div>
                      </div>
                      
                      <h1 className="text-base font-bold">{activeVideo.title}</h1>
                      <div className="flex items-center justify-between py-2 border-b border-[#222222]">
                        <div className="flex items-center gap-3">
                          <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-red-600 to-rose-500 flex items-center justify-center font-bold text-xs">V</div>
                          <div>
                            <h4 className="font-bold text-xs">{activeVideo.channelName}</h4>
                            <p className="text-[10px] text-neutral-400">מאומת ב-VidStar</p>
                          </div>
                        </div>
                      </div>
                      <div className="bg-[#111111] p-4 rounded-2xl border border-[#222222] text-xs text-neutral-300">
                        {activeVideo.description}
                      </div>
                    </div>

                    {/* Streamer & Moderator Chat Box */}
                    <div className="bg-[#111111] border border-[#222222] rounded-3xl flex flex-col h-[520px] shadow-xl">
                      <div className="p-3.5 border-b border-[#222222] flex justify-between items-center text-xs font-bold">
                        <span className="flex items-center gap-2 text-neutral-200">
                          <Icons.Shield className="w-4 h-4 text-blue-400" /> צ׳אט חי ומערכת מודים
                        </span>
                        <span className="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full font-bold">מודרטור</span>
                      </div>
                      
                      <div className="flex-1 p-3.5 overflow-y-auto space-y-2.5 text-xs">
                        {chatLogs.map(item => (
                          <div key={item.id} className="flex justify-between items-start bg-[#181818] p-2.5 rounded-xl border border-[#222222]">
                            <div>
                              <span className="font-bold text-red-400">{item.user}: </span>
                              <span className="text-neutral-200">{item.text}</span>
                            </div>
                            <button 
                              onClick={() => setChatLogs(chatLogs.filter(c => c.id !== item.id))}
                              className="text-neutral-500 hover:text-red-400 p-0.5 transition"
                              title="מחק הודעה"
                            >
                              <Icons.Trash className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ))}
                      </div>

                      <form onSubmit={(e) => {
                        e.preventDefault();
                        if (!chatInput.trim()) return;
                        setChatLogs([...chatLogs, { id: Date.now(), user: 'סטרימר', text: chatInput, role: 'mod' }]);
                        setChatInput('');
                      }} className="p-3 border-t border-[#222222] flex gap-2">
                        <input 
                          type="text" 
                          placeholder="הגב כסטרימר בצ׳אט..." 
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          className="flex-1 bg-[#181818] border border-[#262626] rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-red-600"
                        />
                        <button type="submit" className="bg-red-600 hover:bg-red-500 px-3.5 py-2 rounded-xl text-xs font-bold transition">שלח</button>
                      </form>
                    </div>
                  </div>
                )}

              </main>
            </div>

            {/* UPLOAD MODAL */}
            {isUploadOpen && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-[#111111] border border-[#222222] rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                  <h2 className="text-base font-bold">העלאת תוכן חדש לפלטפורמה</h2>
                  
                  <form onSubmit={handleUploadSubmit} className="space-y-3">
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">כותרת הסרטון / הלייב</label>
                      <input 
                        type="text" 
                        required
                        value={formTitle}
                        onChange={(e) => setFormTitle(e.target.value)}
                        placeholder="לדוגמה: שידור חי גיימינג..."
                        className="w-full bg-[#181818] border border-[#262626] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-red-600"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">קישור לתמונה (Thumbnail URL)</label>
                      <input 
                        type="text" 
                        value={formThumb}
                        onChange={(e) => setFormThumb(e.target.value)}
                        placeholder="https://images.unsplash.com/..."
                        className="w-full bg-[#181818] border border-[#262626] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-red-600"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">תיאור</label>
                      <textarea 
                        value={formDesc}
                        onChange={(e) => setFormDesc(e.target.value)}
                        placeholder="תאר את התוכן שלך..."
                        className="w-full bg-[#181818] border border-[#262626] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none h-20 resize-none"
                      ></textarea>
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">קטגוריה ראשית</label>
                      <select 
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}
                        className="w-full bg-[#181818] border border-[#262626] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none"
                      >
                        {categories.filter(c => c !== 'הכל').map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>

                    <div className="flex items-center gap-2 pt-1">
                      <input 
                        type="checkbox" 
                        id="isLive"
                        checked={formIsLive}
                        onChange={(e) => setFormIsLive(e.target.checked)}
                        className="w-4 h-4 accent-red-600 rounded"
                      />
                      <label htmlFor="isLive" className="text-xs text-neutral-300">הגדר כשידור חי פעיל (Live Stream)</label>
                    </div>

                    <div className="flex gap-2 pt-3">
                      <button 
                        type="button" 
                        onClick={() => setIsUploadOpen(false)}
                        className="flex-1 bg-[#1f1f1f] hover:bg-[#262626] py-2.5 rounded-xl text-xs font-bold transition"
                      >
                        ביטול
                      </button>
                      <button 
                        type="submit" 
                        className="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl text-xs font-bold transition shadow-lg shadow-red-600/30"
                      >
                        פרסם עכשיו
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
