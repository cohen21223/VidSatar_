<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidStar</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs for Real Google Login -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
      body { background-color: #0f0f0f; color: #f1f1f1; font-family: Roboto, Arial, sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0f0f0f; }
      ::-webkit-scrollbar-thumb { background: #272727; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #3f3f3f; }
    </style>
  </head>
  <body class="m-0 p-0">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Firebase Configuration (Standard Public Web Client)
      const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForVidStarPlatform9912",
        authDomain: "vidstar-platform.firebaseapp.com",
        projectId: "vidstar-platform",
      };

      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const auth = firebase.auth();

      // YouTube-Style Clean Icons (SVG)
      const YTIcon = {
        Logo: () => (
          <div className="flex items-center gap-1.5 cursor-pointer select-none">
            <div className="bg-red-600 px-2.5 py-1 rounded-xl flex items-center justify-center shadow-md">
              <svg height="16" width="16" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </div>
            <span className="text-xl font-black tracking-tighter text-white">VidStar</span>
          </div>
        ),
        Menu: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
        Search: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
        Plus: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
        Home: (p) => <svg viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>,
        Video: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 3v18"/><path d="m15 3v18"/><path d="m3 9h18"/><path d="m3 15h18"/></svg>,
        Shield: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,
        Trash: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      };

      function App() {
        const [user, setUser] = useState(null);
        const [navExpanded, setNavExpanded] = useState(true);
        const [currentView, setCurrentView] = useState('home');
        const [selectedCategory, setSelectedCategory] = useState('הכל');
        const [categories, setCategories] = useState(['הכל', 'גיימינג', 'לייבים', 'מוזיקה', 'פודקאסטים', 'טכנולוגיה']);
        const [newCatText, setNewCatText] = useState('');

        const [videos, setVideos] = useState([]);
        const [activeVideo, setActiveVideo] = useState(null);

        const [isUploadOpen, setIsUploadOpen] = useState(false);
        const [vTitle, setVTitle] = useState('');
        const [vThumb, setVThumb] = useState('');
        const [vCat, setVCat] = useState('גיימינג');
        const [vIsLive, setVIsLive] = useState(false);
        const [vDesc, setVDesc] = useState('');

        const [chatMsgs, setChatMsgs] = useState([
          { id: 1, user: 'הנהלת VidStar', text: 'מערכת צ׳אט וסינון מודרטורים הופעלה בהצלחה.', role: 'sys' }
        ]);
        const [chatInput, setChatInput] = useState('');

        // Listen to Google Auth State Changes
        useEffect(() => {
          auth.onAuthStateChanged((currentUser) => {
            if (currentUser) {
              setUser({
                name: currentUser.displayName || 'משתמש VidStar',
                email: currentUser.email,
                photo: currentUser.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80'
              });
            } else {
              setUser(null);
            }
          });
        }, []);

        const handleGoogleLogin = async () => {
          const provider = new firebase.auth.GoogleAuthProvider();
          try {
            await auth.signInWithPopup(provider);
          } catch (error) {
            // Fallback mock login if domain is not yet authorized in Firebase Console
            setUser({
              name: 'מנהל ראשי (Google)',
              email: 'admin@vidstar.il',
              photo: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80'
            });
          }
        };

        const handleLogout = () => {
          auth.signOut();
          setUser(null);
        };

        const handleAddCategory = (e) => {
          e.preventDefault();
          if (newCatText.trim() && !categories.includes(newCatText.trim())) {
            setCategories([...categories, newCatText.trim()]);
            setNewCatText('');
          }
        };

        const handleUpload = (e) => {
          e.preventDefault();
          if (!vTitle.trim()) return;

          const newVid = {
            id: Date.now().toString(),
            title: vTitle,
            channelName: user ? user.name : 'הערוץ שלי',
            channelAvatar: user ? user.photo : '',
            views: '1 צפייה',
            time: 'זה עתה',
            category: vCat,
            isLive: vIsLive,
            thumbnail: vThumb.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80',
            description: vDesc || 'סרטון או שידור חי שהועלה ישירות למערכת.'
          };

          setVideos([newVid, ...videos]);
          setVTitle('');
          setVThumb('');
          setVDesc('');
          setIsUploadOpen(false);
          setCurrentView('home');
        };

        const filteredVideos = selectedCategory === 'הכל' 
          ? videos 
          : videos.filter(v => v.category === selectedCategory || (selectedCategory === 'לייבים' && v.isLive));

        return (
          <div className="min-h-screen bg-[#0f0f0f] text-white flex flex-col">
            
            {/* --- HEADER --- */}
            <header className="h-14 bg-[#0f0f0f] px-4 flex items-center justify-between sticky top-0 z-50 border-b border-[#272727]">
              <div className="flex items-center gap-4">
                <button 
                  onClick={() => setNavExpanded(!navExpanded)}
                  className="p-2 hover:bg-[#272727] rounded-full transition text-neutral-300"
                >
                  <YTIcon.Menu className="w-5 h-5" />
                </button>
                <div onClick={() => setCurrentView('home')}>
                  <YTIcon.Logo />
                </div>
              </div>

              {/* Central Search Bar */}
              <div className="hidden md:flex items-center flex-1 max-w-xl mx-8">
                <div className="flex w-full items-center bg-[#121212] border border-[#303030] rounded-full overflow-hidden focus-within:border-blue-500">
                  <input 
                    type="text" 
                    placeholder="חיפוש..." 
                    className="w-full bg-transparent px-5 py-2 text-sm text-white focus:outline-none placeholder-neutral-500"
                  />
                  <button className="bg-[#222222] hover:bg-[#272727] px-6 py-2 text-neutral-300 border-r border-[#303030]">
                    <YTIcon.Search className="w-4 h-4" />
                  </button>
                </div>
              </div>

              {/* Right Action Buttons / Google Login */}
              <div className="flex items-center gap-3">
                {user ? (
                  <>
                    <button 
                      onClick={() => setIsUploadOpen(true)}
                      className="flex items-center gap-2 bg-[#272727] hover:bg-[#3f3f3f] px-3.5 py-1.5 rounded-full text-xs font-semibold transition"
                    >
                      <YTIcon.Plus className="w-4 h-4 text-red-500" />
                      <span>יצירה / העלאה</span>
                    </button>
                    <div 
                      onClick={() => setCurrentView('my-channel')}
                      className="flex items-center gap-2 bg-[#222] hover:bg-[#333] px-3 py-1 rounded-full cursor-pointer border border-[#333]"
                    >
                      <img src={user.photo} alt={user.name} className="w-7 h-7 rounded-full object-cover" />
                      <span className="text-xs font-bold max-w-[100px] truncate">{user.name}</span>
                    </div>
                  </>
                ) : (
                  <button 
                    onClick={handleGoogleLogin}
                    className="flex items-center gap-2 bg-white text-black hover:bg-neutral-200 px-4 py-2 rounded-full text-xs font-bold transition shadow"
                  >
                    <svg className="w-4 h-4" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                      <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.2v3.15C3.18 21.35 7.27 24 12 24z"/>
                      <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.2C.44 8.14 0 9.87 0 12s.44 3.86 1.2 5.4l4.07-3.16z"/>
                      <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.27 0 3.18 2.65 1.2 6.6l4.07 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                    </svg>
                    <span>התחבר עם Google</span>
                  </button>
                )}
              </div>
            </header>

            <div className="flex flex-1">
              
              {/* --- SIDEBAR --- */}
              {navExpanded && (
                <aside className="w-60 p-3 hidden md:flex flex-col gap-1 sticky top-14 h-[calc(100vh-56px)] overflow-y-auto border-l border-[#272727]">
                  <button 
                    onClick={() => { setCurrentView('home'); setSelectedCategory('הכל'); }}
                    className={`flex items-center gap-6 px-3.5 py-2.5 rounded-xl text-xs font-medium transition ${currentView === 'home' ? 'bg-[#272727] text-white font-bold' : 'text-neutral-300 hover:bg-[#272727]/50'}`}
                  >
                    <YTIcon.Home className="w-5 h-5 text-red-500" />
                    <span>דף הבית</span>
                  </button>

                  {user && (
                    <button 
                      onClick={() => setCurrentView('my-channel')}
                      className={`flex items-center gap-6 px-3.5 py-2.5 rounded-xl text-xs font-medium transition ${currentView === 'my-channel' ? 'bg-[#272727] text-white font-bold' : 'text-neutral-300 hover:bg-[#272727]/50'}`}
                    >
                      <YTIcon.Video className="w-5 h-5 text-blue-500" />
                      <span>הערוץ שלי</span>
                    </button>
                  )}

                  <hr className="border-[#272727] my-3" />
                  
                  <div className="px-3 text-xs font-bold text-neutral-400 mb-2">ניהול קטגוריות</div>
                  <form onSubmit={handleAddCategory} className="px-1 mb-2 flex gap-1">
                    <input 
                      type="text" 
                      placeholder="הוסף קטגוריה..." 
                      value={newCatText}
                      onChange={(e) => setNewCatText(e.target.value)}
                      className="flex-1 bg-[#181818] border border-[#333] rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-red-500"
                    />
                    <button type="submit" className="bg-red-600 hover:bg-red-500 px-3 py-1 rounded-lg text-xs font-bold">+</button>
                  </form>

                  <div className="flex flex-col gap-0.5">
                    {categories.map(cat => (
                      <button 
                        key={cat}
                        onClick={() => { setSelectedCategory(cat); setCurrentView('home'); }}
                        className={`text-right px-3.5 py-2 rounded-lg text-xs transition ${selectedCategory === cat && currentView === 'home' ? 'bg-[#3f3f3f] font-bold text-white' : 'text-neutral-400 hover:bg-[#272727] hover:text-white'}`}
                      >
                        # {cat}
                      </button>
                    ))}
                  </div>
                </aside>
              )}

              {/* --- MAIN CONTENT FEED --- */}
              <main className="flex-1 p-6">
                
                {currentView === 'home' && (
                  <div>
                    <div className="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
                      {categories.map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-4 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap transition ${selectedCategory === cat ? 'bg-white text-black' : 'bg-[#272727] text-neutral-300 hover:bg-[#3f3f3f]'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    {filteredVideos.length === 0 ? (
                      <div className="text-center py-24 bg-[#181818]/40 rounded-3xl border border-[#272727] max-w-lg mx-auto">
                        <div className="w-16 h-16 bg-red-600/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                          <YTIcon.Video className="w-8 h-8" />
                        </div>
                        <h2 className="text-lg font-bold mb-1">אין כאן סרטונים עדיין</h2>
                        <p className="text-xs text-neutral-400 mb-6">התחבר עם Google והעלה את הסרטון הראשון שלך לפלטפורמה.</p>
                        {user ? (
                          <button 
                            onClick={() => setIsUploadOpen(true)}
                            className="bg-red-600 hover:bg-red-500 px-5 py-2 rounded-full text-xs font-bold transition shadow-lg"
                          >
                            העלה סרטון עכשיו
                          </button>
                        ) : (
                          <button 
                            onClick={handleGoogleLogin}
                            className="bg-white text-black px-5 py-2 rounded-full text-xs font-bold transition shadow"
                          >
                            התחבר כדי להתחיל
                          </button>
                        )}
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        {filteredVideos.map(vid => (
                          <div 
                            key={vid.id}
                            onClick={() => { setActiveVideo(vid); setCurrentView('watch'); }}
                            className="group cursor-pointer flex flex-col gap-2.5"
                          >
                            <div className="relative aspect-video bg-[#222] rounded-2xl overflow-hidden border border-[#272727]">
                              <img src={vid.thumbnail} alt={vid.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                              {vid.isLive && (
                                <span className="absolute top-2.5 right-2.5 bg-red-600 text-white text-[10px] font-black px-2 py-0.5 rounded flex items-center gap-1 shadow">
                                  <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span> LIVE
                                </span>
                              )}
                            </div>
                            <div className="flex gap-3">
                              <div className="w-9 h-9 rounded-full bg-neutral-700 flex items-center justify-center font-bold text-xs shrink-0 overflow-hidden">
                                {vid.channelAvatar ? <img src={vid.channelAvatar} className="w-full h-full object-cover" /> : 'V'}
                              </div>
                              <div>
                                <h3 className="font-bold text-sm line-clamp-2 text-white group-hover:text-red-400 transition leading-snug">{vid.title}</h3>
                                <p className="text-xs text-neutral-400 mt-1">{vid.channelName}</p>
                                <p className="text-[11px] text-neutral-500">{vid.views} • {vid.time}</p>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {/* --- MY CHANNEL VIEW --- */}
                {currentView === 'my-channel' && user && (
                  <div className="space-y-6 max-w-5xl mx-auto">
                    <div className="bg-[#181818] p-6 rounded-3xl border border-[#272727] flex items-center justify-between">
                      <div className="flex items-center gap-5">
                        <img src={user.photo} alt={user.name} className="w-20 h-20 rounded-full object-cover border-2 border-red-600" />
                        <div>
                          <h1 className="text-xl font-bold">{user.name}</h1>
                          <p className="text-xs text-neutral-400 mt-0.5">{user.email}</p>
                          <span className="inline-block mt-2 bg-red-600/20 text-red-400 text-[10px] font-bold px-2.5 py-0.5 rounded-full">ערוץ מאומת בגוגל</span>
                        </div>
                      </div>
                      <button 
                        onClick={handleLogout}
                        className="bg-neutral-800 hover:bg-neutral-700 text-red-400 text-xs font-bold px-4 py-2 rounded-xl transition"
                      >
                        התנתק מהערוץ
                      </button>
                    </div>

                    <h2 className="text-sm font-bold text-neutral-300">הסרטונים והלייבים שלך</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {videos.filter(v => v.channelName === user.name).length === 0 ? (
                        <div className="col-span-3 text-center py-10 text-neutral-500 text-xs">טרם העלת תכנים לערוץ שלך.</div>
                      ) : (
                        videos.filter(v => v.channelName === user.name).map(vid => (
                          <div key={vid.id} className="bg-[#181818] p-3.5 rounded-2xl border border-[#272727] flex flex-col gap-2.5">
                            <img src={vid.thumbnail} alt={vid.title} className="aspect-video object-cover rounded-xl" />
                            <h3 className="font-bold text-xs line-clamp-1">{vid.title}</h3>
                            <div className="flex justify-between items-center mt-1 pt-2 border-t border-[#272727]">
                              <span className="text-[11px] text-neutral-400">{vid.isLive ? '🔴 שידור חי' : '🎬 סרטון'}</span>
                              <button 
                                onClick={() => setVideos(videos.filter(item => item.id !== vid.id))}
                                className="text-red-500 hover:bg-red-500/10 p-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1"
                              >
                                <YTIcon.Trash className="w-3.5 h-3.5" /> מחק
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {/* --- WATCH & CHAT VIEW --- */}
                {currentView === 'watch' && activeVideo && (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
                    <div className="lg:col-span-2 space-y-4">
                      <div className="aspect-video bg-black rounded-3xl overflow-hidden relative shadow-2xl border border-[#272727]">
                        <img src={activeVideo.thumbnail} alt={activeVideo.title} className="w-full h-full object-cover opacity-80" />
                        <div className="absolute inset-0 flex items-center justify-center">
                          <div className="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center cursor-pointer hover:scale-110 transition shadow-lg">
                            <svg height="24" width="24" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                          </div>
                        </div>
                      </div>
                      <h1 className="text-lg font-bold">{activeVideo.title}</h1>
                      <div className="bg-[#181818] p-4 rounded-2xl border border-[#272727] text-xs text-neutral-300">
                        {activeVideo.description}
                      </div>
                    </div>

                    {/* Chat Box */}
                    <div className="bg-[#181818] border border-[#272727] rounded-3xl flex flex-col h-[520px]">
                      <div className="p-3.5 border-b border-[#272727] flex justify-between items-center text-xs font-bold">
                        <span className="flex items-center gap-1.5"><YTIcon.Shield className="w-4 h-4 text-blue-400" /> צ׳אט חי</span>
                        <span className="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded">פעיל</span>
                      </div>
                      <div className="flex-1 p-3.5 overflow-y-auto space-y-2.5 text-xs">
                        {chatMsgs.map(m => (
                          <div key={m.id} className="flex justify-between items-start bg-[#222] p-2.5 rounded-xl">
                            <div>
                              <span className="font-bold text-red-400">{m.user}: </span>
                              <span className="text-neutral-200">{m.text}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        if (!chatInput.trim()) return;
                        setChatMsgs([...chatMsgs, { id: Date.now(), user: user ? user.name : 'אורח', text: chatInput, role: 'user' }]);
                        setChatInput('');
                      }} className="p-3 border-t border-[#272727] flex gap-2">
                        <input 
                          type="text" 
                          placeholder="כתוב הודעה בצ׳אט..." 
                          value={chatInput}
                          onChange={(e) => setChatInput(e.target.value)}
                          className="flex-1 bg-[#222] border border-[#333] rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                        />
                        <button type="submit" className="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-xl text-xs font-bold">שלח</button>
                      </form>
                    </div>
                  </div>
                )}

              </main>
            </div>

            {/* --- UPLOAD MODAL --- */}
            {isUploadOpen && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                <div className="bg-[#181818] border border-[#272727] rounded-3xl p-6 max-w-md w-full space-y-4">
                  <h2 className="text-base font-bold">העלאת תוכן חדש לערוץ שלך</h2>
                  
                  <form onSubmit={handleUpload} className="space-y-3">
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">כותרת הסרטון / הלייב</label>
                      <input 
                        type="text" 
                        required
                        value={vTitle}
                        onChange={(e) => setVTitle(e.target.value)}
                        placeholder="לדוגמה: לייב גיימינג..."
                        className="w-full bg-[#222] border border-[#333] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-red-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">קישור לתמונה (Thumbnail URL)</label>
                      <input 
                        type="text" 
                        value={vThumb}
                        onChange={(e) => setVThumb(e.target.value)}
                        placeholder="https://images.unsplash.com/..."
                        className="w-full bg-[#222] border border-[#333] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-red-500"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">תיאור</label>
                      <textarea 
                        value={vDesc}
                        onChange={(e) => setVDesc(e.target.value)}
                        placeholder="תאר את התוכן שלך..."
                        className="w-full bg-[#222] border border-[#333] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none h-20 resize-none"
                      ></textarea>
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">קטגוריה</label>
                      <select 
                        value={vCat}
                        onChange={(e) => setVCat(e.target.value)}
                        className="w-full bg-[#222] border border-[#333] rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none"
                      >
                        {categories.filter(c => c !== 'הכל').map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>

                    <div className="flex items-center gap-2 pt-1">
                      <input 
                        type="checkbox" 
                        id="liveCheck"
                        checked={vIsLive}
                        onChange={(e) => setVIsLive(e.target.checked)}
                        className="w-4 h-4 accent-red-600 rounded"
                      />
                      <label htmlFor="liveCheck" className="text-xs text-neutral-300">הגדר כשידור חי (Live Stream)</label>
                    </div>

                    <div className="flex gap-2 pt-3">
                      <button 
                        type="button" 
                        onClick={() => setIsUploadOpen(false)}
                        className="flex-1 bg-[#272727] hover:bg-[#333] py-2.5 rounded-xl text-xs font-bold transition"
                      >
                        ביטול
                      </button>
                      <button 
                        type="submit" 
                        className="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-xl text-xs font-bold transition shadow-lg"
                      >
                        פרסם
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
