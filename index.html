<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidStar</title>
    <!-- טעינת React ו-Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-neutral-900 text-white m-0 p-0">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // כאן יושב הקוד המקורי של האפליקציה שלך
      function App() {
        const [currentView, setCurrentView] = useState('home');
        const [selectedVideo, setSelectedVideo] = useState(null);
        const [channelTab, setChannelTab] = useState('home');
        const [language, setLanguage] = useState('he');
        const [notifications, setNotifications] = useState([
          { id: 1, text: 'הסרטון שלך הועלה בהצלחה', time: 'לפני 5 דקות', unread: true },
          { id: 2, text: 'משתמש חדש נרשם לערוץ שלך', time: 'לפני שעה', unread: true }
        ]);
        const [showNotifications, setShowNotifications] = useState(false);
        const [toastMessage, setToastMessage] = useState('');

        return (
          <div className="min-h-screen bg-neutral-900 text-white flex flex-col items-center p-6">
            <header className="w-full max-w-4xl flex justify-between items-center py-4 border-b border-neutral-800 mb-6">
              <h1 className="text-2xl font-bold text-red-500">VidStar</h1>
              <div className="text-sm text-neutral-400">האפליקציה המלאה שלך פעילה באוויר! 🚀</div>
            </header>
            
            <main className="w-full max-w-4xl flex flex-col gap-6">
              <div className="bg-neutral-800 p-6 rounded-xl border border-neutral-700 shadow-lg">
                <h2 className="text-xl font-semibold mb-2">ברוך הבא ל-VidStar</h2>
                <p className="text-neutral-300">האתר פועל כעת בצורה מושלמת ב-Vercel. אתה יכול להוסיף לכאן את שאר רכיבי המערכת שלך בקלות!</p>
              </div>
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
