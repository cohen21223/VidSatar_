<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VidStar - פלטפורמת הסטרימינג שלך</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#0f0f0f] text-white m-0 p-0 font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      // Custom SVG Icons
      const Icon = {
        Play: (p) => <svg viewBox="0 0 24 24" fill="currentColor" {...p}><polygon points="5 3 19 12 5 21 5 3"/></svg>,
        Video: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>,
        Radio: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/><path d="M7.8 16.2a6 6 0 0 1 0-8.4"/><path d="M4.9 19.1a10 10 0 0 1 0-14.2"/></svg>,
        Plus: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
        Shield: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,
        Trash: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
        User: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      };

      function App() {
        const [currentView, setCurrentView] = useState('home');
        const [selectedCategory, setSelectedCategory] = useState('הכל');
        const [categories, setCategories] = useState(['הכל', 'גיימינג', 'מוזיקה', 'לייבים', 'טכנולוגיה', 'בידור']);
        const [newCategoryName, setNewCategoryName] = useState('');
        
        // Videos State (מוסרים את כל סרטוני הדוגמה המיותרים)
        const [videos, setVideos] = useState([
          {
            id: '1',
            title: 'ברוכים הבאים לפלטפורמת VidStar החדשה שלי!',
            channelName: 'הערוץ שלי',
            views: '1.2K',
            time: 'לפני שעה',
            category: 'טכנולוגיה',
            isLive: false,
            thumbnail: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80',
            description: 'סרטון הפתיחה של הפלטפורמה.'
          }
        ]);

        const [selectedVideo, setSelectedVideo] = useState(null);
        
        // Upload Modal State
        const [showUploadModal, setShowUploadModal] = useState(false);
        const [uploadTitle, setUploadTitle] = useState('');
        const [uploadCategory, setUploadCategory] = useState('גיימינג');
        const [uploadThumbnail, setUploadThumbnail] = useState('');
        const [isLiveUpload, setIsLiveUpload] = useState(false);

        // Chat & Mod System
        const [chatMessages, setChatMessages] = useState([
          { id: 1, user: 'מערכת', text: 'ברוכים הבאים לצ׳אט החי!', role: 'mod' }
        ]);
        const [newMessage, setNewMessage] = useState('');

        const handleAddCategory = (e) => {
          e.preventDefault();
          if (newCategoryName.trim() && !categories.includes(newCategoryName)) {
            setCategories([...categories, newCategoryName]);
            setNewCategoryName('');
          }
        };

        const handleUploadVideo = (e) => {
          e.preventDefault();
          if (!uploadTitle.trim()) return;

          const newVid = {
            id: Date.now().toString(),
            title: uploadTitle,
            channelName: 'הערוץ שלי',
            views: '1',
            time: 'זה עתה',
            category: uploadCategory,
            isLive: isLiveUpload,
            thumbnail: uploadThumbnail.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80',
            description: 'הועלה דרך סטודיו היוצרים של VidStar.'
          };

          setVideos([newVid, ...videos]);
          setUploadTitle('');
          setUploadThumbnail('');
          setShowUploadModal(false);
          setCurrentView('home');
        };

        const filteredVideos = selectedCategory === 'הכל' 
          ? videos 
          : videos.filter(v => v.category === selectedCategory || (selectedCategory === 'לייבים' && v.isLive));

        return (
          <div className="min-h-screen bg-[#0f0f0f] text-white flex flex-col">
            
            {/* Top Navbar */}
            <header className="h-14 bg-[#0f0f0f] border-b border-[#272727] px-4 flex items-center justify-between sticky top-0 z-50">
              <div className="flex items-center gap-4 cursor-pointer" onClick={() => setCurrentView('home')}>
                {/* לוגו אישי משלך */}
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 bg-red-600 rounded-lg flex items-center justify-center font-black text-lg shadow-lg shadow-red-600/30">
                    V
                  </div>
                  <span className="text-xl font-extrabold tracking-wider bg-gradient-to-r from-white to-neutral-400 bg-clip-text text-transparent">
                    VidStar<span className="text-red-600">.IL</span>
                  </span>
                </div>
              </div>

              {/* Actions */}
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setShowUploadModal(true)}
                  className="flex items-center gap-2 bg-[#272727] hover:bg-[#3f3f3f] px-3.5 py-1.5 rounded-full text-xs font-bold transition"
                >
                  <Icon.Plus className="w-4 h-4 text-red-500" />
                  <span>העלה סרטון / שידור חי</span>
                </button>

                <button 
                  onClick={() => setCurrentView('my-channel')}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold transition ${currentView === 'my-channel' ? 'bg-red-600 text-white' : 'bg-[#272727] hover:bg-[#3f3f3f]'}`}
                >
                  <Icon.User className="w-4 h-4" />
                  <span>הערוץ שלי</span>
                </button>
              </div>
            </header>

            <div className="flex flex-1">
              {/* Sidebar */}
              <aside className="w-64 p-3 hidden md:flex flex-col gap-1 border-l border-[#272727] sticky top-14 h-[calc(100vh-56px)] overflow-y-auto">
                <button 
                  onClick={() => setCurrentView('home')}
                  className={`flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm font-medium transition ${currentView === 'home' ? 'bg-[#272727] text-white font-bold' : 'text-neutral-300 hover:bg-[#272727]/50'}`}
                >
                  <Icon.Play className="w-5 h-5 text-red-500" />
                  <span>דף הבית</span>
                </button>
                <button 
                  onClick={() => setCurrentView('my-channel')}
                  className={`flex items-center gap-4 px-3 py-2.5 rounded-xl text-sm font-medium transition ${currentView === 'my-channel' ? 'bg-[#272727] text-white font-bold' : 'text-neutral-300 hover:bg-[#272727]/50'}`}
                >
                  <Icon.Video className="w-5 h-5 text-blue-500" />
                  <span>הסרטונים והלייבים שלי</span>
                </button>

                <hr className="border-[#272727] my-3" />
                
                <div className="px-3 text-xs font-bold text-neutral-400 mb-2">ניהול קטגוריות</div>
                <form onSubmit={handleAddCategory} className="px-1 mb-2 flex gap-1">
                  <input 
                    type="text" 
                    placeholder="הוסף קטגוריה..." 
                    value={newCategoryName}
                    onChange={(e) => setNewCategoryName(e.target.value)}
                    className="flex-1 bg-[#1f1f1f] border border-[#3f3f3f] rounded-lg px-2 py-1 text-xs text-white focus:outline-none focus:border-red-500"
                  />
                  <button type="submit" className="bg-red-600 hover:bg-red-500 px-2.5 py-1 rounded-lg text-xs font-bold">+</button>
                </form>

                <div className="flex flex-col gap-1">
                  {categories.map(cat => (
                    <button 
                      key={cat}
                      onClick={() => { setSelectedCategory(cat); setCurrentView('home'); }}
                      className={`text-right px-3 py-1.5 rounded-lg text-xs transition ${selectedCategory === cat && currentView === 'home' ? 'bg-[#3f3f3f] font-bold text-white' : 'text-neutral-400 hover:bg-[#272727] hover:text-white'}`}
                    >
                      # {cat}
                    </button>
                  ))}
                </div>
              </aside>

              {/* Main Content */}
              <main className="flex-1 p-6">
                
                {/* HOME VIEW */}
                {currentView === 'home' && (
                  <div>
                    {/* Categories Chips */}
                    <div className="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
                      {categories.map(cat => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          className={`px-4 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-white text-black' : 'bg-[#272727] text-neutral-300 hover:bg-[#3f3f3f]'}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    {/* Videos Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {filteredVideos.map(vid => (
                        <div 
                          key={vid.id}
                          onClick={() => { setSelectedVideo(vid); setCurrentView('watch'); }}
                          className="group cursor-pointer flex flex-col gap-2"
                        >
                          <div className="relative aspect-video bg-[#1f1f1f] rounded-xl overflow-hidden">
                            <img src={vid.thumbnail} alt={vid.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                            {vid.isLive && (
                              <span className="absolute top-2 right-2 bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded flex items-center gap-1 shadow">
                                <span className="w-2 h-2 rounded-full bg-white animate-pulse"></span> LIVE
                              </span>
                            )}
                          </div>
                          <div className="flex gap-3">
                            <div className="w-9 h-9 rounded-full bg-neutral-700 flex items-center justify-center font-bold text-xs">V</div>
                            <div>
                              <h3 className="font-bold text-sm line-clamp-2 text-white group-hover:text-blue-400 transition">{vid.title}</h3>
                              <p className="text-xs text-neutral-400 mt-1">{vid.channelName}</p>
                              <p className="text-xs text-neutral-500">{vid.views} צפיות • {vid.time}</p>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* MY CHANNEL VIEW */}
                {currentView === 'my-channel' && (
                  <div className="space-y-6">
                    <div className="bg-[#1f1f1f] p-6 rounded-2xl border border-[#272727] flex items-center gap-4">
                      <div className="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-2xl font-black">V</div>
                      <div>
                        <h1 className="text-xl font-bold">הערוץ שלי (VidStar Creator)</h1>
                        <p className="text-xs text-neutral-400 mt-0.5">כאן מוצגים כל הסרטונים והשידורים החיים שהעלת לפלטפורמה.</p>
                      </div>
                    </div>

                    <h2 className="text-lg font-bold">התוכן שלי</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {videos.filter(v => v.channelName === 'הערוץ שלי').map(vid => (
                        <div key={vid.id} className="bg-[#1f1f1f] p-3 rounded-xl border border-[#272727] flex flex-col gap-2">
                          <img src={vid.thumbnail} alt={vid.title} className="aspect-video object-cover rounded-lg" />
                          <h3 className="font-bold text-sm">{vid.title}</h3>
                          <div className="flex justify-between items-center mt-2">
                            <span className="text-xs text-neutral-400">{vid.isLive ? '🔴 שידור חי' : '🎬 סרטון רגיל'}</span>
                            <button 
                              onClick={() => setVideos(videos.filter(item => item.id !== vid.id))}
                              className="text-red-500 hover:bg-red-500/10 p-1.5 rounded-lg text-xs"
                            >
                              <Icon.Trash className="w-4 h-4" />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* WATCH / STREAM & MODERATOR SYSTEM VIEW */}
                {currentView === 'watch' && selectedVideo && (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 space-y-4">
                      <div className="aspect-video bg-black rounded-2xl overflow-hidden relative shadow-2xl border border-[#272727]">
                        <img src={selectedVideo.thumbnail} alt={selectedVideo.title} className="w-full h-full object-cover opacity-80" />
                        <div className="absolute inset-0 flex items-center justify-center">
                          <div className="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center cursor-pointer hover:scale-110 transition shadow-lg">
                            <Icon.Play className="w-8 h-8 fill-current ml-1" />
                          </div>
                        </div>
                      </div>
                      <h1 className="text-lg font-bold">{selectedVideo.title}</h1>
                      <p className="text-xs text-neutral-400">{selectedVideo.description}</p>
                    </div>

                    {/* Streamer & Moderator Chat System */}
                    <div className="bg-[#1f1f1f] border border-[#272727] rounded-2xl flex flex-col h-[500px]">
                      <div className="p-3 border-b border-[#272727] flex justify-between items-center text-xs font-bold">
                        <span className="flex items-center gap-1.5"><Icon.Shield className="w-4 h-4 text-blue-400" /> צ׳אט חי ומערכת מודים</span>
                        <span className="text-[10px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded">מצב ניהול פעיל</span>
                      </div>
                      <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
                        {chatMessages.map(msg => (
                          <div key={msg.id} className="flex justify-between items-start bg-[#272727]/50 p-2 rounded-lg group">
                            <div>
                              <span className="font-bold text-neutral-300">{msg.user}: </span>
                              <span className="text-white">{msg.text}</span>
                            </div>
                            <button 
                              onClick={() => setChatMessages(chatMessages.filter(m => m.id !== msg.id))}
                              className="text-neutral-500 hover:text-red-400 text-[10px]"
                              title="מחק הודעה (מודרטור)"
                            >
                              מחק
                            </button>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={(e) => {
                        e.preventDefault();
                        if (!newMessage.trim()) return;
                        setChatMessages([...chatMessages, { id: Date.now(), user: 'מנהל / סטרימר', text: newMessage, role: 'mod' }]);
                        setNewMessage('');
                      }} className="p-3 border-t border-[#272727] flex gap-2">
                        <input 
                          type="text" 
                          placeholder="הגב בצ׳אט כסטרימר..." 
                          value={newMessage}
                          onChange={(e) => setNewMessage(e.target.value)}
                          className="flex-1 bg-[#272727] border border-[#3f3f3f] rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                        />
                        <button type="submit" className="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-xl text-xs font-bold">שלח</button>
                      </form>
                    </div>
                  </div>
                )}

              </main>
            </div>

            {/* UPLOAD MODAL */}
            {showUploadModal && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                <div className="bg-[#1f1f1f] border border-[#272727] rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                  <h2 className="text-lg font-bold">העלאת תוכן חדש ל-VidStar</h2>
                  
                  <form onSubmit={handleUploadVideo} className="space-y-3">
                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">כותרת הסרטון / הלייב</label>
                      <input 
                        type="text" 
                        required
                        value={uploadTitle}
                        onChange={(e) => setUploadTitle(e.target.value)}
                        placeholder="לדוגמה: לייב גיימינג חדש..."
                        className="w-full bg-[#272727] border border-[#3f3f3f] rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">קישור לתמונה (Thumbnail URL)</label>
                      <input 
                        type="text" 
                        value={uploadThumbnail}
                        onChange={(e) => setUploadThumbnail(e.target.value)}
                        placeholder="https://images.unsplash.com/..."
                        className="w-full bg-[#272727] border border-[#3f3f3f] rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="text-xs text-neutral-400 block mb-1">בחר קטגוריה</label>
                      <select 
                        value={uploadCategory}
                        onChange={(e) => setUploadCategory(e.target.value)}
                        className="w-full bg-[#272727] border border-[#3f3f3f] rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                      >
                        {categories.filter(c => c !== 'הכל').map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>

                    <div className="flex items-center gap-2 pt-2">
                      <input 
                        type="checkbox" 
                        id="isLive"
                        checked={isLiveUpload}
                        onChange={(e) => setIsLiveUpload(e.target.checked)}
                        className="w-4 h-4 accent-red-600"
                      />
                      <label htmlFor="isLive" className="text-xs text-neutral-300">הגדר כשידור חי (Live Stream)</label>
                    </div>

                    <div className="flex gap-2 pt-4">
                      <button 
                        type="button" 
                        onClick={() => setShowUploadModal(false)}
                        className="flex-1 bg-[#272727] hover:bg-[#3f3f3f] py-2 rounded-xl text-xs font-bold"
                      >
                        ביטול
                      </button>
                      <button 
                        type="submit" 
                        className="flex-1 bg-red-600 hover:bg-red-500 py-2 rounded-xl text-xs font-bold"
                      >
                        פרסם עכשיו
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
